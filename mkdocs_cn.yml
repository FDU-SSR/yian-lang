site_name: YIAN 语法文档（中文）
site_description: YIAN 语言语法与标准库文档
docs_dir: docs/grammar
site_url: ""

theme:
  name: material
  features:
    - announce.dismiss
    - navigation.sections
    - toc.follow
    - content.code.copy
    - content.tabs.link

extra:
  generator: false

plugins:
  - tooltips
  - glightbox
  - search:
      lang: zh

markdown_extensions:
  - pymdownx.highlight:
      linenums: false
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始: 00.quick_start.md
  - 词法: 01.lexicon.md
  - 类型系统: 02.type_system.md
  - 变量与声明: 03.variables.md
  - 函数: 04.functions.md
  - 方法: 05.methods.md
  - 控制流: 06.control_flow.md
  - 模式匹配: 07.match.md
  - 表达式: 08.expressions.md
  - 运算符重载: 09.operators.md
  - 泛型: 10.generics.md
  - 结构体与枚举: 11.structs_enums.md
  - Trait 与 Impl: 12.traits_impls.md
  - 模块系统: 13.modules.md
  - 标准库: 14.standard_library.md
  - 赋值与显式内存管理: 15.assign_semantics.md
  - 运行时错误与安全终止: 16.runtime_errors.md
  - C ABI FFI: 17.ffi.md
