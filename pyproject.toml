[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yian"
version = "0.1.1"
description = "YIAN programming language compiler (yianc) and package manager (anx)"
requires-python = ">=3.11"
dependencies = ["llvmlite>=0.49.0"]

[project.optional-dependencies]
# lsp extra 提供语言服务器 yian-lsp 所需的 pygls；yianc 与 anx 不依赖它。
lsp = ["pygls>=2.1"]

[project.scripts]
yianc = "compiler.main:main"
anx = "anx.main:main"
yian-lsp = "lsp.main:main"

[tool.setuptools.packages.find]
include = ["compiler*", "anx*", "lsp*"]
namespaces = true

[tool.pyright]
include = ["compiler", "anx", "lsp"]
exclude = ["bak", "tests", "docs", "**/node_modules", "**/__pycache__", "**/.*"]
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
